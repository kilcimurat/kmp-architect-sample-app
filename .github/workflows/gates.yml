name: gates

# The two verification gates, on every push and pull request.
#
# This runs on Linux, which is worth saying out loud because half of it looks impossible there.
# Apple link and test tasks are silently SKIPPED on a non-macOS host while Gradle still reports
# BUILD SUCCESSFUL, so a Linux job that "builds the iOS framework" proves nothing. `isolationCheck`
# is the exception: it resolves dependency metadata for `iosSimulatorArm64CompileKlibraries` rather
# than invoking the Apple toolchain, so its iOS half is as valid here as it is on a Mac.
#
# What is therefore NOT covered by this workflow, and needs a macOS runner or a local run:
# framework linking, the Xcode host builds, and the iOS unit tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: architectureCheck + isolationCheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Structural gates
        run: ./gradlew architectureCheck isolationCheck buildLogicTest --stacktrace

      # There is no JVM target: modules are Android + iosArm64 + iosSimulatorArm64. The Android
      # unit tests run here; the iOS ones are among the tasks Linux skips.
      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Production Android build
        run: ./gradlew :app:android:assembleDebug --stacktrace

      - name: Sample Android builds
        run: |
          ./gradlew \
            :sample:feed:androidApp:assembleDebug \
            :sample:article:androidApp:assembleDebug \
            :sample:bookmarks:androidApp:assembleDebug \
            --stacktrace

      # The edge and resolved-graph counts quoted in the README come from here, so a stale number
      # is a downloadable artifact away from being noticed rather than a claim nobody rechecks.
      - name: Upload architecture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-reports
          path: build/reports/architecture/
          if-no-files-found: error
